<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#0c0c0f;font-family:'Schibsted Grotesk',system-ui,sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:40px}
  h1{font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
  p{color:#9a9aa1;margin:0 0 28px;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .card{background:#141016;border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .lg{width:96px;height:96px;display:grid;place-items:center}
  .num{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:#7c7d87}
  .nm{font-weight:600;font-size:13px;text-align:center}
  svg{display:block;overflow:visible}
  .foot{display:flex;gap:14px;align-items:center;margin-top:30px;flex-wrap:wrap}
</style></head><body><div class="wrap">
<h1>Flimify — logo concepts</h1><p>Warm coral, no text. Tell me a number — I'll refine it (gradient, glow, weight, corners) and apply it everywhere.</p>
<div class="grid">

  <div class="card"><div class="lg"><svg width="96" height="96" viewBox="0 0 100 100">
    <path d="M28 36 L48 50 L28 64 Z" fill="#E2885F" opacity=".22"/>
    <path d="M38 34 L60 50 L38 66 Z" fill="#E2885F" opacity=".5"/>
    <path d="M50 31 L76 50 L50 69 Z" fill="#F0975F" stroke="#F0975F" stroke-width="7" stroke-linejoin="round"/>
  </svg></div><div class="num">01</div><div class="nm">Play + motion trail</div></div>

  <div class="card"><div class="lg"><svg width="96" height="96" viewBox="0 0 100 100">
    <rect x="14" y="14" width="72" height="72" rx="22" fill="#E2885F"/>
    <path d="M50 28 C52.5 44 56 47.5 72 50 C56 52.5 52.5 56 50 72 C47.5 56 44 52.5 28 50 C44 47.5 47.5 44 50 28 Z" fill="#1a1015"/>
  </svg></div><div class="num">02</div><div class="nm">Spark squircle</div></div>

  <div class="card"><div class="lg"><svg width="96" height="96" viewBox="0 0 100 100">
    <rect x="19" y="28" width="6" height="44" rx="3" fill="#E2885F" opacity=".32"/>
    <rect x="31" y="24" width="13" height="52" rx="6.5" fill="#E2885F"/>
    <rect x="31" y="24" width="40" height="13" rx="6.5" fill="#F0975F"/>
    <rect x="31" y="45" width="30" height="13" rx="6.5" fill="#F0975F"/>
  </svg></div><div class="num">03</div><div class="nm">Motion F</div></div>

  <div class="card"><div class="lg"><svg width="96" height="96" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="27" fill="none" stroke="#E2885F" stroke-width="9" stroke-linecap="round" stroke-dasharray="118 52" transform="rotate(-40 50 50)"/>
    <path d="M45 40 L62 50 L45 60 Z" fill="#F0975F" stroke="#F0975F" stroke-width="4" stroke-linejoin="round"/>
  </svg></div><div class="num">04</div><div class="nm">Orbit play</div></div>

  <div class="card"><div class="lg"><svg width="96" height="96" viewBox="0 0 100 100">
    <rect x="20" y="20" width="60" height="60" rx="19" fill="none" stroke="#E2885F" stroke-width="9"/>
    <path d="M43 37 L65 50 L43 63 Z" fill="#E2885F" stroke="#E2885F" stroke-width="5" stroke-linejoin="round"/>
  </svg></div><div class="num">05</div><div class="nm">Frame + play</div></div>

  <div class="card"><div class="lg"><svg width="96" height="96" viewBox="0 0 100 100">
    <g fill="#E2885F"><rect x="24" y="30" width="13" height="13" rx="3.5"/><rect x="24" y="57" width="13" height="13" rx="3.5"/>
      <rect x="63" y="30" width="13" height="13" rx="3.5"/><rect x="63" y="57" width="13" height="13" rx="3.5"/></g>
    <path d="M43 41 L61 50 L43 59 Z" fill="#F0975F" stroke="#F0975F" stroke-width="4" stroke-linejoin="round"/>
  </svg></div><div class="num">06</div><div class="nm">Filmstrip play</div></div>

  <div class="card"><div class="lg"><svg width="96" height="96" viewBox="0 0 100 100">
    <path d="M32 26 h28 a6.5 6.5 0 0 1 0 13 h-15 v9 h12 a6.5 6.5 0 0 1 0 13 h-12 v13 a6.8 6.8 0 0 1 -13.6 0 V32 a6 6 0 0 1 6 -6 Z" fill="#E2885F"/>
    <circle cx="72" cy="70" r="6.5" fill="#F0975F"/>
  </svg></div><div class="num">07</div><div class="nm">Bold F + dot</div></div>

  <div class="card"><div class="lg"><svg width="96" height="96" viewBox="0 0 100 100">
    <rect x="14" y="14" width="72" height="72" rx="22" fill="#E2885F"/>
    <path d="M42 33 L66 50 L42 67 Z" fill="#1a1015"/>
  </svg></div><div class="num">08</div><div class="nm">Play squircle</div></div>

</div>

</div>
