<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Flimify</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#09090b" />
<link rel="icon" type="image/png" href="flimify-favicon.png" />
<link rel="apple-touch-icon" href="flimify-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="auth.css" />
</head>
<body>
<div class="auth-bg"></div>
<div class="auth-wrap">
  <div class="card">
    <a href="index.html" class="brand"><img class="glyph" src="flimify-logo.png" alt="Flimify"><span>Flimify <small>Studio</small></span></a>
    <h1 id="title">Sign in</h1>
    <p class="sub">Sign in with Google to manage your account. The free plan includes 5 renders a month.</p>

    <button class="gbtn" id="googleBtn">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.11a6.6 6.6 0 0 1 0-4.22V7.05H2.18a11 11 0 0 0 0 9.9l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.05l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
      Continue with Google
    </button>

    <p class="err" id="err" hidden></p>
    <p class="fine">One account per Google login. By continuing you agree to the Terms &amp; Privacy Policy. We only read your name, email, and avatar.</p>
    <a href="index.html" class="back">← Back to site</a>
  </div>
</div>

<script src="config.js"></script>
<script type="module">
  import { signInWithGoogle, getUser } from "./auth.js";

  const $ = id => document.getElementById(id);
  const err = $("err"), googleBtn = $("googleBtn");
  const showErr = m => { err.textContent = m; err.hidden = false; };

  googleBtn.addEventListener("click", async () => {
    err.hidden = true;
    googleBtn.disabled = true; googleBtn.classList.add("loading");
    const { error } = await signInWithGoogle();
    if (error) {
      showErr(error.message || "Couldn't start Google sign-in. Try again.");
      googleBtn.disabled = false; googleBtn.classList.remove("loading");
    }
    // success → redirects to Google, returns to APP_REDIRECT (account.html)
  });

  // Already signed in → go back where they were (the install step), else the dashboard.
  getUser().then(u => {
    if (!u) return;
    let n = null;
    try { n = sessionStorage.getItem('flimify_next'); sessionStorage.removeItem('flimify_next'); } catch (e) {}
    let dest = "account.html";
    try { if (n && new URL(n, location.origin).origin === location.origin) dest = n; } catch (e) {}
    location.replace(dest);
  });
</script>
</body>
</html>
