      statusText.textContent = ctx.sequenceName + sel;
    } else if (ctx && ctx.projectName) {
      statusText.textContent = ctx.projectName.replace(/\.prproj$/i, '');
    } else {
      statusText.textContent = 'Bridge live';
    }
    return true;
  } catch {
    statusEl.className = 'pill err';
    statusText.textContent = "Bridge offline · run Claude Bridge.command";
    return false;
  }
}

refreshStatus();
// Slower polling — every 4s was hammering Premiere's ExtendScript engine.
setInterval(refreshStatus, 15000);

/* CEP wheel-scroll fallback: some Premiere versions/Chromium builds don't
   route mouse wheel to scrollable children unless we intercept explicitly. */
function attachWheelScroll(el) {
  el.addEventListener('wheel', (e) => {
    const max = el.scrollHeight - el.clientHeight;
    if (max <= 0) return; // no overflow, let it bubble
    const before = el.scrollTop;
    const next = Math.max(0, Math.min(max, before + e.deltaY));
    el.scrollTop = next;
    if (next !== before) e.preventDefault();
  }, { passive: false });
}
attachWheelScroll(log);
attachWheelScroll(input);

/* ───── Send flow ───── */
let activeChatAbort = null;
const escHint = document.getElementById('escHint');

function updateEscHint() {
  const anyBusy = !!activeChatAbort || expanding;
  escHint.classList.toggle('show', anyBusy);
}

function setBusy(busy) {
  if (busy) {
    sendBtn.classList.add('sending');
    sendBtn.title = 'Cancel · esc';
    sendBtn.disabled = false; // stays clickable so it can cancel
  } else {
    sendBtn.classList.remove('sending');
    sendBtn.title = 'Send · ↵';
  }
  updateEscHint();
}

function cancelActive() {
  let cancelled = false;
  if (activeChatAbort) {
    try { activeChatAbort.abort(); } catch {}
    activeChatAbort = null;
    cancelled = true;
  }
  if (expanding && expandAbort) {
    try { expandAbort.abort(); } catch {}
    cancelled = true;
  }
  return cancelled;
}

function setIterationContext(ctx) {
  iterationContext = ctx;
  const bar = document.getElementById('iterBar');
  if (!bar) return;
  if (!ctx) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  const filename = (ctx.originalPath || '').split('/').pop().split('\\').pop();
  bar.innerHTML =
      '<span class="iter-label">Iterating on</span>'
    + '<span class="iter-name">' + escapeHTML(filename) + '</span>'
    + '<button class="iter-cancel" type="button" title="Cancel iteration">×</button>';
  bar.style.display = '';
  bar.querySelector('.iter-cancel').addEventListener('click', () => setIterationContext(null));
}

async function sendMessage() {
  if (activeChatAbort) return; // already in flight
  const msg = input.value.trim();
  if (!msg) return;
  clearEmpty();
  input.value = '';
  autosize();
  clearGhost();

  // Build the message that goes to Claude — one [REFERENCE: ...] line per attached file.
  // Iteration context (from the Changes button) is prepended invisibly so the
  // user's bubble shows just their tweak.
  let outboundMsg = msg;
  if (iterationContext) {
    outboundMsg =
        'Make a new version of a previous render.\n'
      + 'Original prompt: "' + iterationContext.originalPrompt + '"\n'
      + 'Previous file: ' + iterationContext.originalPath + '\n'
      + 'Change: ' + msg;
  }
  if (activeReferences.length) {
    const refLines = activeReferences.map(r => '[REFERENCE: ' + r.path + ']').join('\n');
    outboundMsg = refLines + '\n' + outboundMsg;
  }

  // Build the user-message bubble with inline thumbnails for any images.
  // If this send was an iteration (Changes button), prepend a small
  // "Replying to <filename>" header so the bubble visibly shows what it's
  // tweaking — without leaking the original prompt + path into the chat.
  let youHTML = '';
  if (iterationContext) {
    const iterFile = (iterationContext.originalPath || '').split('/').pop().split('\\').pop();
    youHTML += '<div class="reply-ref">'
      + '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;flex-shrink:0;color:var(--accent)"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>'
      + '<span class="reply-ref-label">Replying to</span>'
      + '<span class="reply-ref-name">' + escapeHTML(iterFile) + '</span>'
      + '</div>';
  }
  youHTML += '<p>' + escapeHTML(msg).replace(/\n/g,'<br>') + '</p>';
  if (activeReferences.length) {
    let thumbsHTML = '<div class="msg-thumbs">';
    for (const r of activeReferences) {
      if (r.kind === 'image' && r.dataUrl) {
        thumbsHTML += '<img class="msg-thumb" src="' + r.dataUrl + '" title="' + escapeHTML(r.name) + '">';
      } else {
        thumbsHTML += '<div class="msg-thumb video" title="' + escapeHTML(r.name) + '">' + escapeHTML(r.name) + '</div>';
      }
    }
    thumbsHTML += '</div>';
    youHTML += thumbsHTML;
  }
  makeMsg('you', youHTML);
  setBusy(true);
  // The iteration context was already baked into outboundMsg; clear it so the
  // next prompt is fresh unless the user explicitly hits Changes again.
  if (iterationContext) setIterationContext(null);
  // References were already serialized into outboundMsg + thumbs were rendered
  // into the user bubble — clear the composer's reference bar so they don't
  // silently get re-attached to the next prompt.
  if (activeReferences.length) clearReferences();

  const placeholder = makeMsg('claude', thinkingHTML());

  let context = null;
  try { context = await getPremiereContext(); } catch {}

  activeChatAbort = new AbortController();
  const estimateSec = estimatePromptDuration(msg, activeReferences.length > 0);
  const progressUI = makeProgressUI(placeholder.body, estimateSec);

  // Subscribe to bridge progress events — bridge pushes a status string each
  // time Claude calls a tool (Bash, Read, Write, etc.), and the working
  // indicator swaps from "Working" to e.g. "Rendering video".
  const labelEl = placeholder.body.querySelector('.orbit-label');
  let progressES = null;
  try {
    progressES = new EventSource(BRIDGE + '/progress-stream');
    progressES.addEventListener('progress', (ev) => {
      try {
        const { text } = JSON.parse(ev.data);
        if (text && labelEl) labelEl.textContent = text;
        if (text && progressUI && progressUI.setStatus) progressUI.setStatus(text);
      } catch {}
    });
    progressES.addEventListener('done', () => {
      try { progressES.close(); } catch {}
      progressES = null;
    });
  } catch {}

  try {
    const r = await fetch(BRIDGE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: outboundMsg, context }),
      signal: activeChatAbort.signal,
    });
    const data = await r.json();
    progressUI.complete();
    // Brief beat so the eye sees the bar hit 100% before content swaps in
    await new Promise(res => setTimeout(res, 350));
    progressUI.cleanup();

    if (data.error) throw new Error(data.error);
    const replyText = data.reply || '(no response)';
    placeholder.body.innerHTML = renderMarkdown(replyText);
    streamReveal(placeholder.body);

    if (data.imports && data.imports.length) {
      for (const p of data.imports) {
        addRenderPreview(placeholder.wrap, p, msg);
      }
    }
  } catch (err) {
    progressUI.cleanup();
    if (err.name === 'AbortError') {
      placeholder.body.innerHTML = '<p style="color:var(--text-dim);font-style:italic">Cancelled.</p>';
    } else {
      placeholder.body.innerHTML = '<p>Error: ' + escapeHTML(err.message) + '</p><p style="color:var(--text-dim);font-size:11.5px">Is the bridge running?</p>';
    }
  } finally {
    if (progressES) { try { progressES.close(); } catch {} progressES = null; }
    activeChatAbort = null;
    setBusy(false);
    input.focus();
  }
}

/* ───── Input UX ───── */
function autosize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
}

/* ───── Live AI ghost-text autocomplete ───── */
let activeSuggestion = '';
let activePrefix = '';
let completionTimer = null;
let completionAbort = null;
const COMPLETION_DEBOUNCE_MS = 700;
const MIN_PREFIX_LEN = 5;

function clearGhost() {
  activeSuggestion = '';
  activePrefix = '';
  ghostTyped.textContent = '';
  ghostSuggest.textContent = '';
  hint.classList.remove('has-ghost');
}
function showGhost(typed, tail) {
  if (!tail || input.value !== typed) return;
  activeSuggestion = tail;
  activePrefix = typed;
  ghostTyped.textContent = typed;
  ghostSuggest.textContent = tail;
  hint.classList.add('has-ghost');
}
function acceptGhost() {
  if (!activeSuggestion || activePrefix !== input.value) return false;
  input.value = input.value + activeSuggestion;
  autosize();
  clearGhost();
  return true;
}

const inputStack = document.querySelector('.input-stack');
function setThinking(on) { inputStack.classList.toggle('thinking', !!on); }

function requestCompletion() {
  if (completionTimer) { clearTimeout(completionTimer); completionTimer = null; }
  if (completionAbort) { try { completionAbort.abort(); } catch {} completionAbort = null; }
  setThinking(false);

  const typed = input.value;
  if (!typed || typed.length < MIN_PREFIX_LEN || /\n/.test(typed)) return;

  completionTimer = setTimeout(async () => {
    completionAbort = new AbortController();
    const sentPrefix = typed;
    setThinking(true);
    try {
      const r = await fetch(BRIDGE + '/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prefix: sentPrefix }),
        signal: completionAbort.signal,
      });
      const data = await r.json();
      if (input.value === sentPrefix) {
        if (data && data.completion) showGhost(sentPrefix, data.completion);
        setThinking(false);
      }
    } catch {
      // aborted or net error — silently drop
      if (input.value === sentPrefix) setThinking(false);
    }
  }, COMPLETION_DEBOUNCE_MS);
}

input.addEventListener('input', () => {
  autosize();
  // The visible suggestion is now stale the instant the user types another char.
  if (activeSuggestion) clearGhost();
  requestCompletion();
});
input.addEventListener('scroll', () => { ghost.scrollTop = input.scrollTop; });
input.addEventListener('blur', clearGhost);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Tab' && activeSuggestion) {
    e.preventDefault();
    acceptGhost();
    return;
  }
  if (e.key === 'Escape' && activeSuggestion) {
    e.preventDefault();
    clearGhost();
    return;
  }
  if ((e.key === 'ArrowRight') && activeSuggestion && input.selectionStart === input.value.length) {
    e.preventDefault();
    acceptGhost();
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', () => {
  if (activeChatAbort || expanding) {
    cancelActive();
  } else {
    sendMessage();
  }
});

// Wire the ESC hint pill to the same cancel path
escHint.addEventListener('click', cancelActive);

// Global ESC: priority chain — lightbox > history > cancel-in-flight
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (lightbox.classList.contains('show')) {
    e.preventDefault();
    closeLightbox();
    return;
  }
  if (historyPanel.classList.contains('show')) {
    e.preventDefault();
    closeHistory();
    return;
  }
  if (activeChatAbort || expanding) {
    e.preventDefault();
    cancelActive();
  }
});

/* ───── Prompt Expand (3 levels) ───── */
const expandGroup = document.getElementById('expandGroup');
const expandBtns = expandGroup.querySelectorAll('.expand-btn');
let expandAbort = null;
let expanding = false;

function syncExpandEnabled() {
  const hasText = !!input.value.trim();
  expandBtns.forEach(b => { b.disabled = !hasText || expanding; });
}
input.addEventListener('input', syncExpandEnabled);
syncExpandEnabled();

async function expandPrompt(level, clickedBtn) {
  const text = input.value.trim();
  if (!text || expanding) return;
  expanding = true;
  expandGroup.classList.add('busy');
  clickedBtn.classList.add('loading');
  syncExpandEnabled();
  updateEscHint();

  if (expandAbort) { try { expandAbort.abort(); } catch {} }
  expandAbort = new AbortController();
  let failureNote = null;
  try {
    const r = await fetch(BRIDGE + '/expand', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text, level }),
      signal: expandAbort.signal,
    });
    if (!r.ok) throw new Error('Bridge returned ' + r.status);
    const data = await r.json();
    if (data && data.expanded) {
      input.value = data.expanded;
      autosize();
      clearGhost();
      inputWrapEl.classList.remove('flash');
      void inputWrapEl.offsetWidth;
      inputWrapEl.classList.add('flash');
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    } else {
      failureNote = 'Expand returned empty — bridge or Claude may be down';
    }
  } catch (err) {
    if (err.name !== 'AbortError') failureNote = 'Expand failed: ' + (err.message || 'unknown');
  }
  if (failureNote) {
    // Surface the failure on the input border + a tiny red badge inside the chip
    inputWrapEl.style.borderColor = 'var(--err)';
    setTimeout(() => { inputWrapEl.style.borderColor = ''; }, 2000);
    const old = clickedBtn.querySelector('svg');
    const errIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
    if (old) {
      const orig = old.outerHTML;
      old.outerHTML = errIcon;
      clickedBtn.style.color = 'var(--err)';
      clickedBtn.title = failureNote;
      setTimeout(() => { clickedBtn.innerHTML = orig; clickedBtn.style.color = ''; clickedBtn.title = 'Expand prompt'; }, 2000);
    }
  }

  expanding = false;
  expandGroup.classList.remove('busy');
  clickedBtn.classList.remove('loading');
  syncExpandEnabled();
  updateEscHint();
}

expandBtns.forEach(btn => {
  btn.addEventListener('click', () => expandPrompt(btn.dataset.level, btn));
});

/* Chips fill the input AND immediately try to autocomplete (no-op since prompt is full) */
chipsContainer.addEventListener('click', (e) => {
  const c = e.target.closest('.chip');
  if (!c) return;
  input.value = c.dataset.prompt;
  autosize();
  clearGhost();
  input.focus();
});
</script>

<!-- Dev-only live-reload (TEMPORARY). Remove this script when shipping. -->
<script>
(function(){
  var BRIDGE_URL = 'http://127.0.0.1:3737/dev/reload-stream';
  var es = null;
  function connect() {
    try {
      es = new EventSource(BRIDGE_URL);
      es.addEventListener('reload', function () {
        try { if (window.__adobe_cep__ && window.__adobe_cep__.invalidateContents) window.__adobe_cep__.invalidateContents(); } catch (e) {}
        location.reload();
      });
      es.onerror = function () {
        try { es.close(); } catch (e) {}
        setTimeout(connect, 1500);
      };
    } catch (e) {
      setTimeout(connect, 2000);
    }
  }
  connect();
})();
</script>
