<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Claude</title>
<style>
  :root {
    --bg-base:     #0d0d10;
    --bg-elevated: rgba(24, 24, 28, 0.72);
    --surface:     rgba(38, 38, 44, 0.65);
    --surface-2:   rgba(50, 50, 58, 0.7);
    --border:      rgba(255, 255, 255, 0.06);
    --border-soft: rgba(255, 255, 255, 0.04);
    --border-strong: rgba(255, 255, 255, 0.12);

    --text:        #f2efe6;
    --text-dim:    #9b9588;
    --text-faint:  #5e584e;

    --accent:      #d97757;
    --accent-2:    #e89a6c;
    --accent-hover:#e88566;
    --accent-soft: rgba(217, 119, 87, 0.14);
    --accent-line: rgba(217, 119, 87, 0.45);
    --accent-glow: rgba(217, 119, 87, 0.55);

    --ok:          #6fbf8a;
    --err:         #e07474;

    --radius-sm: 7px;
    --radius-md: 12px;
    --radius-lg: 16px;

    --spring:    cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-out:  cubic-bezier(0.16, 1, 0.3, 1);
    --ease:      cubic-bezier(0.4, 0, 0.2, 1);

    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-base);
    overflow: hidden;
  }
  body {
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* ───── BACKGROUND (static — animated blurs were crashing CEP's old Chromium) ───── */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    background:
      radial-gradient(380px 380px at 12% 8%,  rgba(217, 119, 87, 0.20), transparent 70%),
      radial-gradient(320px 320px at 92% 98%, rgba(232, 154, 108, 0.13), transparent 70%);
  }
  .aurora .blob { display: none; }

  /* Visibly chunky scrollbars — CEP's older Chromium hides thin ones */
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.025); }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.18);
    border-radius: 6px;
    border: 2px solid transparent;
    background-clip: padding-box;
    transition: background 0.2s;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(217, 119, 87, 0.55); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* ───── HEADER ───── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .header::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-line), transparent);
    opacity: 0.6;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.2px;
    cursor: pointer;
    padding: 4px 8px 4px 4px;
    border-radius: 8px;
    transition: background 0.2s var(--ease);
    user-select: none;
  }
  .brand:hover { background: rgba(255, 255, 255, 0.04); }
  .brand:active { background: rgba(255, 255, 255, 0.07); }
  .brand:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
  .brand-dot {
    position: relative;
    width: 22px; height: 22px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 50%, #b04d2f 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 11px;
    box-shadow:
      0 0 16px rgba(217, 119, 87, 0.35),
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 1px 0 rgba(255, 255, 255, 0.2) inset;
  }
  .brand-dot::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.4), transparent 50%);
    pointer-events: none;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 10px 4px 8px;
    border-radius: 100px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 10.5px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    max-width: 60%;
    min-width: 0;
    overflow: hidden;
    transition: border-color 0.4s var(--ease), background 0.4s var(--ease);
  }
  /* Ellipsis on the inner text span — the flex container can't truncate
     because the LED dot is a sibling. The text needs its own overflow rule. */
  .pill .status-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1 1 auto;
  }
  .led {
    position: relative;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
  }
  .led::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
  }
  .pill.ok  .led { background: var(--ok); box-shadow: 0 0 8px rgba(111,191,138,0.7); }
  .pill.ok  .led::after { animation: ledPulse 2.4s var(--ease-out) infinite; box-shadow: 0 0 0 0 rgba(111,191,138,0.6); }
  .pill.err .led { background: var(--err); box-shadow: 0 0 8px rgba(224,116,116,0.7); }
  .pill.err {
    border-color: rgba(224, 116, 116, 0.4);
    background: rgba(224, 116, 116, 0.08);
    color: #e89684;
  }
  @keyframes ledPulse {
    0%   { box-shadow: 0 0 0 0 rgba(111,191,138,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(111,191,138,0); }
    100% { box-shadow: 0 0 0 0 rgba(111,191,138,0); }
  }

  /* ───── LOG ───── */
  #log {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    padding: 22px 14px 8px;
    scroll-behavior: smooth;
    position: relative;
    -webkit-overflow-scrolling: touch;
  }

  /* ───── EMPTY STATE ───── */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100%;
    text-align: center;
    padding: 28px 10px 40px;
    gap: 14px;
  }
  .empty-logo {
    position: relative;
    width: 52px; height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, #b04d2f 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 24px;
    box-shadow:
      0 12px 30px rgba(217, 119, 87, 0.3),
      0 0 0 1px rgba(255,255,255,0.08) inset,
      0 1px 0 rgba(255, 255, 255, 0.25) inset;
    animation: breath 4s var(--ease-out) infinite, fadeUp 0.7s var(--spring) backwards;
  }
  .empty-logo::before {
    content: '';
    position: absolute;
    inset: -16px;
    border-radius: inherit;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
    z-index: -1;
    animation: halo 4s var(--ease-out) infinite;
  }
  .empty-logo::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.5), transparent 55%);
    pointer-events: none;
  }
  @keyframes breath {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }
  @keyframes halo {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%      { opacity: 0.75; transform: scale(1.15); }
  }
  .empty h1 {
    margin: 6px 0 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.4px;
    background: linear-gradient(180deg, #fff 0%, #d8d2c5 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: fadeUp 0.7s var(--ease-out) 0.1s backwards;
  }
  .empty p {
    margin: 0;
    font-size: 12.5px;
    color: var(--text-dim);
    max-width: 250px;
    line-height: 1.55;
    animation: fadeUp 0.7s var(--ease-out) 0.18s backwards;
  }
  .empty-search-wrap {
    position: relative;
    width: 100%;
    max-width: 360px;
    margin-top: 4px;
    animation: fadeUp 0.7s var(--ease-out) 0.22s backwards;
  }
  .empty-search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 13px; height: 13px;
    color: var(--text-faint);
    pointer-events: none;
  }
  .empty-search {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 12px 9px 32px;
    background: rgba(20, 20, 24, 0.6);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 12.5px;
    outline: none;
    transition: border-color 0.3s var(--ease), background 0.3s var(--ease), box-shadow 0.4s var(--ease);
  }
  .empty-search::placeholder { color: var(--text-faint); }
  .empty-search:focus {
    border-color: var(--accent-line);
    background: rgba(20, 20, 24, 0.85);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .empty-no-match {
    color: var(--text-faint);
    font-size: 12px;
    font-style: italic;
    margin-top: 6px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 8px;
    width: 100%;
    max-width: 100%;
    padding: 0 6px;
    box-sizing: border-box;
  }
  .chip.hidden { display: none; }
  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 9px;
    border-radius: 100px;
    font-size: 10.5px;
    line-height: 1.3;
    cursor: pointer;
    transition: transform 0.4s var(--spring), background 0.25s var(--ease), border-color 0.25s var(--ease), color 0.25s var(--ease), box-shadow 0.3s var(--ease);
    user-select: none;
    opacity: 0;
    animation: fadeUp 0.6s var(--spring) forwards;
  }
  .chip:nth-child(1) { animation-delay: 0.28s; }
  .chip:nth-child(2) { animation-delay: 0.36s; }
  .chip:nth-child(3) { animation-delay: 0.44s; }
  .chip:nth-child(4) { animation-delay: 0.52s; }
  .chip:hover {
    background: var(--surface-2);
    border-color: var(--accent-line);
    color: var(--text);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(217, 119, 87, 0.18);
  }
  .chip:active { transform: translateY(-1px) scale(0.97); transition-duration: 0.1s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ───── MESSAGES ───── */
  .msg {
    display: flex;
    gap: 11px;
    margin-bottom: 18px;
    animation: msgIn 0.45s var(--ease-out);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 24px; height: 24px;
    border-radius: 7px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px;
    font-weight: 700;
    margin-top: 1px;
    position: relative;
  }
  .you .avatar {
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .claude .avatar {
    background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, #b04d2f 100%);
    color: #fff;
    box-shadow:
      0 0 14px rgba(217, 119, 87, 0.35),
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 1px 0 rgba(255, 255, 255, 0.25) inset;
  }
  .claude .avatar::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.4), transparent 55%);
    pointer-events: none;
  }
  .msg-content {
    flex: 1;
    min-width: 0;
    padding-top: 3px;
  }
  .msg-author {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.1px;
  }
  .you .msg-author    { color: #b6b0a2; }
  .claude .msg-author { color: var(--accent); }

  .msg-body {
    color: var(--text);
    word-wrap: break-word;
    overflow-wrap: anywhere;
    font-size: 13px;
    line-height: 1.6;
    user-select: text;
    -webkit-user-select: text;
    cursor: text;
  }
  .msg-body p { margin: 0 0 8px; }
  .msg-body p:last-child { margin-bottom: 0; }

  /* "Replying to filename.mp4" header on a user bubble that came from
     the Changes button — visible signal that iteration context was attached. */
  .reply-ref {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px 4px 7px;
    margin-bottom: 6px;
    background: rgba(217, 119, 87, 0.1);
    border-left: 2px solid var(--accent);
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-dim);
    max-width: 100%;
    overflow: hidden;
  }
  .reply-ref svg { width: 11px !important; height: 11px !important; color: var(--accent); flex-shrink: 0; }
  /* Safety net — any inline SVG inside a chat bubble caps at 14px so a
     missing width attribute can never blow the panel up again. */
  .msg-body svg { max-width: 14px; max-height: 14px; }
  .reply-ref-label { color: var(--accent); font-weight: 500; }
  .reply-ref-name {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .msg-body strong { color: #fff; font-weight: 600; }
  .msg-body em { color: var(--text); font-style: italic; }
  .msg-body code {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    padding: 1.5px 5.5px;
    border-radius: 5px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: #f0d9b8;
  }
  .msg-body pre {
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 11px 13px;
    margin: 10px 0;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.55;
    color: #f0d9b8;
  }
  .msg-body pre code { background: none; border: none; padding: 0; color: inherit; font-size: inherit; }
  .msg-body ul { margin: 6px 0; padding-left: 18px; }
  .msg-body li { margin-bottom: 3px; }
  .msg-body a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent-line); }
  .msg-body a:hover { color: var(--accent-hover); border-bottom-style: solid; }

  /* Word-by-word reveal — simple opacity/translate, no blur filter (CEP unstable) */
  .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(3px);
    animation: wordIn 0.35s var(--ease-out) forwards;
  }
  @keyframes wordIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ───── PROGRESS BAR under the orbital thinking dots ───── */
  .thinking-stack { display: flex; flex-direction: column; }
  .thinking-row { display: flex; align-items: center; gap: 6px; }
  .thinking-elapsed {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .thinking-eta {
    font-size: 10.5px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    padding-left: 8px;
    border-left: 1px solid var(--border-soft);
    margin-left: 4px;
  }
  .progress-bar {
    margin-top: 10px;
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 100px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent-2) 0%, var(--accent) 50%, #b04d2f 100%);
    transition: width 0.5s var(--ease-out);
    position: relative;
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: translateX(-100%);
    animation: progressShimmer 1.6s linear infinite;
  }
  .progress-bar.complete .progress-bar-fill {
    transition: width 0.4s var(--ease-out);
  }
  .progress-bar.complete .progress-bar-fill::after { animation: none; opacity: 0; }
  @keyframes progressShimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(220%); }
  }

  /* ───── ORBITAL THINKING ───── */
  .orbit {
    position: relative;
    width: 26px; height: 26px;
    display: inline-block;
    vertical-align: middle;
  }
  .orbit-dot {
    position: absolute;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    top: 50%; left: 50%;
    margin: -2.5px;
    box-shadow: 0 0 8px var(--accent-glow);
    animation: orbit 1.4s linear infinite;
    transform-origin: 0 0;
  }
  .orbit-dot:nth-child(2) { animation-delay: -0.467s; opacity: 0.7; }
  .orbit-dot:nth-child(3) { animation-delay: -0.933s; opacity: 0.45; }
  @keyframes orbit {
    from { transform: rotate(0deg) translateX(9px); }
    to   { transform: rotate(360deg) translateX(9px); }
  }
  .orbit-label {
    margin-left: 6px;
    color: var(--text-dim);
    font-size: 12px;
    vertical-align: middle;
    background: linear-gradient(90deg, var(--text-dim) 0%, var(--text) 50%, var(--text-dim) 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 2.4s linear infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% center; }
    100% { background-position: -200% center; }
  }

  /* ───── IMPORT RECEIPTS ───── */
  .receipt {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 9px 12px;
    background: linear-gradient(135deg, rgba(111,191,138,0.10), rgba(111,191,138,0.04));
    border: 1px solid rgba(111,191,138,0.25);
    border-radius: var(--radius-md);
    font-size: 11.5px;
    color: var(--text);
    animation: receiptIn 0.55s var(--spring) backwards;
    transform-origin: left center;
  }
  .receipt.fail {
    background: linear-gradient(135deg, rgba(224,116,116,0.10), rgba(224,116,116,0.04));
    border-color: rgba(224,116,116,0.3);
  }
  @keyframes receiptIn {
    from { opacity: 0; transform: translateX(8px) scale(0.97); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  .receipt-icon-wrap {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: rgba(111,191,138,0.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .receipt.fail .receipt-icon-wrap { background: rgba(224,116,116,0.18); }
  .receipt-icon { width: 12px; height: 12px; color: var(--ok); }
  .receipt.fail .receipt-icon { color: var(--err); }
  .receipt-text {
    flex: 1; min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .receipt-name { font-weight: 500; color: var(--text); }
  .receipt-sub  { color: var(--text-dim); margin-left: 5px; font-size: 10.5px; }

  /* ───── Render preview card (inline video + Import button) ───── */
  .render-preview {
    margin-top: 10px;
    padding: 10px;
    background: rgba(20, 20, 24, 0.55);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    animation: receiptIn 0.55s var(--spring) backwards;
    transform-origin: left center;
  }
  .render-preview-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .render-preview-name {
    flex: 1;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .render-preview-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .render-import-btn {
    padding: 8px 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.2s var(--ease), opacity 0.2s var(--ease);
    box-shadow: 0 2px 8px rgba(217, 119, 87, 0.22);
  }
  .render-import-btn:hover { filter: brightness(1.08); }
  .render-import-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .render-discard-btn {
    padding: 8px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-family: var(--font-ui);
    font-size: 12px;
    cursor: pointer;
    transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  .render-discard-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.18); }

  /* ───── COMPOSER ───── */
  .composer {
    flex-shrink: 0;
    padding: 10px 12px 12px;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    position: relative;
  }
  .composer::before {
    content: '';
    position: absolute;
    top: -1px; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-line), transparent);
    opacity: 0.5;
  }
  .input-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    background: rgba(20, 20, 24, 0.6);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    transition: border-color 0.35s var(--ease), background 0.35s var(--ease), box-shadow 0.4s var(--ease);
  }
  .input-wrap:focus-within {
    border-color: var(--accent-line);
    background: rgba(20, 20, 24, 0.8);
    box-shadow:
      0 0 0 4px var(--accent-soft),
      0 8px 24px rgba(217, 119, 87, 0.12);
  }
  #input {
    background: transparent;
    color: var(--text);
    border: none;
    outline: none;
    padding: 11px 12px 6px;
    font-family: var(--font-ui);
    font-size: 13px;
    line-height: 1.55;
    resize: none;
    min-height: 22px;
    max-height: 180px;
    width: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  #input::placeholder { color: var(--text-faint); }

  .input-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px 7px;
  }
  .hint-text {
    font-size: 10.5px;
    color: var(--text-faint);
    user-select: none;
    transition: color 0.3s var(--ease);
  }
  .input-wrap:focus-within ~ .hint-text { color: var(--text-dim); }
  .hint-text kbd {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-strong);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: var(--font-ui);
    font-size: 10px;
    color: var(--text-dim);
    margin: 0 1px;
  }
  #send {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, #b04d2f 100%);
    color: #fff;
    border: none;
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.35s var(--spring), box-shadow 0.35s var(--ease), filter 0.3s var(--ease);
    box-shadow:
      0 4px 12px rgba(217, 119, 87, 0.35),
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 1px 0 rgba(255, 255, 255, 0.25) inset;
  }
  #send::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition: left 0.6s var(--ease);
  }
  #send:hover:not(:disabled)::before { left: 130%; }
  #send:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow:
      0 8px 20px rgba(217, 119, 87, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.12) inset,
      0 1px 0 rgba(255, 255, 255, 0.3) inset;
  }
  #send:active:not(:disabled) { transform: translateY(0) scale(0.96); transition-duration: 0.1s; }
  #send:disabled {
    background: var(--surface-2);
    color: var(--text-faint);
    cursor: not-allowed;
    box-shadow: none;
    filter: saturate(0.4);
  }
  #send svg { width: 14px; height: 14px; position: relative; z-index: 1; }
  #send .stop-icon { display: none; }
  #send.sending {
    background: linear-gradient(135deg, #e08a6b 0%, #c44b3a 60%, #8a2818 100%);
    box-shadow: 0 4px 14px rgba(196, 75, 58, 0.5), 0 0 0 1px rgba(255,255,255,0.08) inset;
    animation: sendPulse 1.6s ease-in-out infinite;
  }
  #send.sending .send-icon { display: none; }
  #send.sending .stop-icon { display: block; }
  @keyframes sendPulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(196, 75, 58, 0.45), 0 0 0 1px rgba(255,255,255,0.08) inset; }
    50%      { box-shadow: 0 4px 22px rgba(196, 75, 58, 0.7),  0 0 0 1px rgba(255,255,255,0.16) inset; }
  }
  /* ESC hint badge */
  .esc-hint {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-right: 8px;
    padding: 3px 8px 3px 6px;
    border-radius: 6px;
    background: rgba(196, 75, 58, 0.14);
    border: 1px solid rgba(196, 75, 58, 0.45);
    color: #e89684;
    font-size: 10.5px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s var(--ease);
    user-select: none;
  }
  .esc-hint.show { opacity: 1; pointer-events: auto; cursor: pointer; }
  .esc-hint kbd {
    background: rgba(196, 75, 58, 0.22);
    border: 1px solid rgba(196, 75, 58, 0.5);
    border-radius: 3px;
    padding: 0 5px;
    font-family: var(--font-ui);
    font-size: 10px;
    color: #fff;
  }

  /* ───── PROMPT EXPAND BUTTONS (3 intensity levels) ───── */
  .expand-group {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-right: 5px;
  }
  .expand-btn {
    background: transparent;
    color: var(--text-faint);
    border: none;
    height: 24px;
    padding: 0 8px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 4px;
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: transform 0.3s var(--spring), background 0.2s var(--ease), color 0.2s var(--ease), box-shadow 0.3s var(--ease);
    position: relative;
  }
  .expand-btn svg { width: 11px; height: 11px; transition: transform 0.4s var(--ease); }
  .expand-group::before {
    content: 'Extend';
    color: var(--text-dim);
    font-size: 10.5px;
    font-weight: 500;
    padding: 0 6px 0 4px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .expand-btn[data-level="light"]  { color: rgba(217, 119, 87, 0.55); }
  .expand-btn[data-level="medium"] { color: rgba(217, 119, 87, 0.78); }
  .expand-btn[data-level="heavy"]  { color: rgba(217, 119, 87, 1); }
  .expand-btn:hover:not(:disabled) {
    background: var(--accent-soft);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .expand-btn:hover:not(:disabled) svg { transform: rotate(12deg) scale(1.1); }
  .expand-btn:active:not(:disabled) { transform: scale(0.92); transition-duration: 0.1s; }
  .expand-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .expand-btn.loading {
    background: var(--accent-soft);
    color: var(--accent);
    cursor: wait;
  }
  .expand-btn.loading svg { animation: expandSpin 1.4s linear infinite; }
  @keyframes expandSpin { to { transform: rotate(360deg); } }
  /* Disable siblings while one is loading so the user can't double-fire */
  .expand-group.busy .expand-btn:not(.loading) { opacity: 0.3; pointer-events: none; }

  /* Brief flash when the input gets a fresh expansion */
  @keyframes expandFlash {
    0%   { box-shadow: 0 0 0 0 var(--accent-soft), 0 8px 24px rgba(217, 119, 87, 0.0); }
    35%  { box-shadow: 0 0 0 6px var(--accent-soft), 0 8px 24px rgba(217, 119, 87, 0.18); }
    100% { box-shadow: 0 0 0 0 transparent, 0 0 0 transparent; }
  }
  .input-wrap.flash { animation: expandFlash 0.9s var(--ease-out); }

  /* ───── INPUT STACK + GHOST AUTOCOMPLETE ───── */
  .input-stack {
    position: relative;
  }
  .input-stack::after {
    content: '';
    position: absolute;
    right: 10px;
    bottom: 7px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.25s var(--ease), transform 0.35s var(--spring);
    pointer-events: none;
    z-index: 3;
  }
  .input-stack.thinking::after {
    opacity: 1;
    transform: scale(1);
    animation: thinkPulse 1.5s ease-in-out infinite;
  }
  @keyframes thinkPulse {
    0%, 100% { opacity: 0.45; box-shadow: 0 0 4px var(--accent-glow); }
    50%      { opacity: 1;    box-shadow: 0 0 12px var(--accent-glow); }
  }
  #input, .ghost {
    font-family: var(--font-ui);
    font-size: 13px;
    line-height: 1.55;
    padding: 11px 12px 6px;
    margin: 0;
    border: 0;
    word-wrap: break-word;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #input {
    position: relative;
    z-index: 2;
    background: transparent;
  }
  .ghost {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    pointer-events: none;
    color: transparent;
    overflow: hidden;
    user-select: none;
  }
  .ghost-typed { color: transparent; }
  .ghost-suggest {
    color: rgba(242, 239, 230, 0.42);
    transition: opacity 0.2s var(--ease);
  }
  .ghost-tab {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 5px 2px;
    border: 1px solid rgba(217, 119, 87, 0.35);
    background: var(--accent-soft);
    border-radius: 4px;
    font-size: 9.5px;
    color: var(--accent);
    letter-spacing: 0.3px;
    vertical-align: 2px;
    font-family: var(--font-ui);
    font-weight: 600;
    transform: translateY(-1px);
  }

  /* Hint text becomes more prominent when a suggestion is showing */
  .hint-text.has-ghost kbd.k-tab {
    border-color: var(--accent-line);
    color: var(--accent);
    background: var(--accent-soft);
  }

  /* ───── PLACEMENT MODE PILLS ───── */
  .mode-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 9px 4px;
    border-bottom: 1px solid var(--border-soft);
  }
  .mode-bar-label {
    font-size: 9.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-right: 4px;
    font-weight: 600;
    user-select: none;
  }
  .mode-pill {
    flex: 1 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.3s var(--spring), background 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease), box-shadow 0.3s var(--ease);
    user-select: none;
  }
  .mode-pill svg { width: 11px; height: 11px; }
  .mode-pill:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border-color: var(--border-strong);
  }
  .mode-pill.active {
    background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, #b04d2f 100%);
    color: #fff;
    border-color: transparent;
    box-shadow:
      0 4px 12px rgba(217, 119, 87, 0.3),
      0 0 0 1px rgba(255, 255, 255, 0.1) inset,
      0 1px 0 rgba(255, 255, 255, 0.25) inset;
  }
  .mode-pill.active:hover { transform: translateY(-1px); }
  .mode-pill:active { transform: scale(0.96); transition-duration: 0.1s; }

  /* Auto-Cut button — sits in the mode-bar next to placement pills */
  .autocut-btn {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-dim);
    font-family: var(--font-ui);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.2s var(--ease), border-color 0.2s var(--ease), background 0.2s var(--ease);
  }
  .autocut-btn svg { width: 12px; height: 12px; }
  .autocut-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.04); }
  .autocut-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .autocut-btn.busy { color: var(--accent); border-color: var(--accent-line); }

  /* Auto-Cut review card — list of proposed cuts, each with Apply / Skip */
  .autocut-card {
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(20, 20, 24, 0.55);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    animation: receiptIn 0.55s var(--spring) backwards;
  }
  .autocut-card-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .autocut-card-header b { color: var(--text); font-weight: 600; }
  .autocut-list {
    display: flex; flex-direction: column; gap: 4px;
    max-height: 240px;
    overflow-y: auto;
  }
  .autocut-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    background: rgba(0,0,0,0.18);
    border-radius: 7px;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
  }
  .autocut-row.applied { opacity: 0.5; }
  .autocut-row.applied .autocut-row-time { text-decoration: line-through; }
  .autocut-row-time { color: var(--text); min-width: 110px; }
  .autocut-row-reason { color: var(--text-dim); flex: 1; }
  .autocut-row-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 10.5px;
    cursor: pointer;
  }
  .autocut-row-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .autocut-actions {
    display: flex; gap: 6px;
    margin-top: 10px;
  }
  .autocut-apply-all {
    flex: 1;
    padding: 7px 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 7px;
    color: #fff;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.2s var(--ease);
  }
  .autocut-apply-all:hover { filter: brightness(1.08); }
  .autocut-apply-all:disabled { opacity: 0.5; cursor: not-allowed; }
  .autocut-dismiss {
    padding: 7px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text-dim);
    font-size: 11.5px;
    cursor: pointer;
  }
  .autocut-dismiss:hover { color: var(--text); }

  /* ───── REFERENCE BAR ───── */
  .ref-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 9px 4px;
    border-bottom: 1px solid var(--border-soft);
    min-height: 30px;
  }
  .iter-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(217, 119, 87, 0.06);
    font-size: 11px;
    color: var(--text-dim);
  }
  .iter-bar .iter-label { color: var(--accent); font-weight: 500; }
  .iter-bar .iter-name {
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1; min-width: 0;
  }
  .iter-bar .iter-cancel {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1;
  }
  .iter-bar .iter-cancel:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .ref-add {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px 4px 8px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px dashed var(--border-strong);
    color: var(--text-dim);
    font-size: 10.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s var(--ease);
    user-select: none;
  }
  .ref-add svg { width: 11px; height: 11px; }
  .ref-add:hover {
    background: rgba(217, 119, 87, 0.06);
    border-color: var(--accent-line);
    color: var(--accent);
  }

  .ref-bar { flex-wrap: wrap; }
  .ref-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 4px 2px 4px;
    border-radius: 100px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    color: var(--text);
    font-size: 10.5px;
    max-width: 100%;
    overflow: hidden;
    animation: refIn 0.35s var(--spring);
  }
  .ref-chip-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.4);
  }
  .ref-chip-thumb.video::after {
    content: '';
    /* video play indicator can go here */
  }
  @keyframes refIn { from { opacity:0; transform: scale(0.92); } to { opacity:1; transform: scale(1); } }
  .ref-chip .ref-icon {
    width: 12px; height: 12px;
    color: var(--accent);
    flex-shrink: 0;
    margin-left: 4px;
  }
  .ref-chip .ref-name {
    flex: 1; min-width: 0;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
    padding-right: 2px;
  }

  /* Receipt-level action buttons (Preview, etc) */
  .receipt-action {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-size: 10.5px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s var(--ease);
    flex-shrink: 0;
    margin-left: 4px;
  }
  .receipt-action:hover {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent-line);
  }

  /* Larger thumbnails inside the user's message bubble */
  .msg-thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .msg-thumb {
    width: 72px; height: 72px;
    border-radius: 6px;
    object-fit: cover;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.4);
    display: block;
  }
  .msg-thumb.video {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 10.5px;
    text-align: center;
    padding: 6px;
  }
  .ref-chip .ref-remove {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s var(--ease);
    flex-shrink: 0;
    padding: 0;
  }
  .ref-chip .ref-remove:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  .ref-chip .ref-remove svg { width: 10px; height: 10px; }

  /* Thumbnails are clickable previews */
  .ref-chip-thumb, .msg-thumb { cursor: zoom-in; }

  /* ───── LIGHTBOX ───── */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: fadeIn 0.2s ease-out;
  }
  .lightbox.show { display: flex; }
  .lightbox-content {
    position: relative;
    max-width: 100%;
    max-height: 100%;
  }
  .lightbox-content img,
  .lightbox-content video {
    max-width: 100%;
    max-height: calc(100vh - 60px);
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: block;
  }
  .lightbox-close {
    position: absolute;
    top: -10px; right: -10px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s var(--ease);
  }
  .lightbox-close:hover { background: var(--accent); color: #fff; }
  .lightbox-close svg { width: 14px; height: 14px; }
  .lightbox-caption {
    color: var(--text-dim);
    text-align: center;

/* Render chips on the empty state */
function renderChips(container) {
  if (!container) return;
  container.innerHTML = '';
  SUGGESTIONS.forEach(([label, prompt], i) => {
    const c = document.createElement('div');
    c.className = 'chip';
    c.dataset.prompt = prompt;
    c.dataset.haystack = (label + ' ' + prompt).toLowerCase();
    c.textContent = label;
    c.style.animationDelay = (0.28 + (i % 12) * 0.04) + 's';
    container.appendChild(c);
  });

/* Live-filter chips as the user types in the empty-state search box.
   Event-delegated on #log so the handler still fires after resetToHome
   re-mounts the empty state from its HTML snapshot. */
function filterChips(query) {
  const q = (query || '').trim().toLowerCase();
  const chipsEl = document.getElementById('chips');
  const noMatch = document.getElementById('emptyNoMatch');
  if (!chipsEl) return;
  let shown = 0;
  chipsEl.querySelectorAll('.chip').forEach(c => {
    const hit = !q || (c.dataset.haystack || '').indexOf(q) >= 0;
    c.classList.toggle('hidden', !hit);
    if (hit) shown++;
  });
  if (noMatch) noMatch.style.display = shown === 0 ? '' : 'none';
}

/* ───── ExtendScript bridge ───── */
let _esBusy = false;
function evalES(script) {
  return new Promise((resolve) => {
    if (!window.__adobe_cep__) return resolve(null);
    if (_esBusy) return resolve(null); // never overlap calls — protects Premiere
    _esBusy = true;
    try {
      window.__adobe_cep__.evalScript(script, (result) => {
        _esBusy = false;
        resolve(result);
      });
    } catch (e) {
      _esBusy = false;
      resolve(null);
    }
  });
}
async function getPremiereContext() {
  const raw = await evalES('ccGetContext()');
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}
async function importIntoPremiere(absPath, mode) {
  const escapedPath = absPath.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
  const escapedMode = (mode || 'overlay').replace(/[^a-z]/gi, '');
  const raw = await evalES('ccImportToTimeline("' + escapedPath + '","' + escapedMode + '")');
  try { return JSON.parse(raw); } catch { return { ok:false, error:'parse failed', path:absPath }; }
}

async function maximizeFrame() {
  const raw = await evalES('ccMaximizeFrame()');
  try { return JSON.parse(raw); } catch { return { ok:false }; }
}

async function getSelectedClipInfo() {
  const raw = await evalES('ccGetSelectedClip()');
  try { return JSON.parse(raw); } catch { return { ok:false, error:'parse failed' }; }
}

async function applyAutoCuts(cuts) {
  const json = JSON.stringify(cuts).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
  const raw = await evalES('ccApplyAutoCuts("' + json + '")');
  try { return JSON.parse(raw); } catch { return { ok:false, error:'parse failed' }; }
}

function formatSec(s) {
  if (typeof s !== 'number') return '—';
  const m = Math.floor(s / 60), sec = s - m * 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
}

// Build the proposed-cuts review card inside the chat log
function addAutoCutCard(clipInfo, cuts, totalCut) {
  const wrap = makeMsg('claude', '');
  const card = document.createElement('div');
  card.className = 'autocut-card';

  const headerCutCount = cuts.length;
  card.innerHTML =
      '<div class="autocut-card-header">'
    +   '<b>' + headerCutCount + '</b> cut' + (headerCutCount === 1 ? '' : 's') + ' proposed on <b>' + escapeHTML(clipInfo.name) + '</b>'
    +   '<span style="margin-left:auto">would remove <b>' + totalCut.toFixed(1) + 's</b></span>'
    + '</div>'
    + '<div class="autocut-list"></div>'
    + '<div class="autocut-actions">'
    +   '<button class="autocut-apply-all" type="button">Apply all</button>'
    +   '<button class="autocut-dismiss" type="button">Dismiss</button>'
    + '</div>';

  const list = card.querySelector('.autocut-list');
  cuts.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'autocut-row';
    row.dataset.idx = i;
    row.innerHTML =
        '<span class="autocut-row-time">' + formatSec(c.start) + ' → ' + formatSec(c.end) + '</span>'
      + '<span class="autocut-row-reason">' + escapeHTML(c.reason || '') + '</span>'
      + '<button class="autocut-row-btn" data-act="apply">Apply</button>'
      + '<button class="autocut-row-btn" data-act="skip">Skip</button>';
    list.appendChild(row);
  });

  wrap.body.appendChild(card);

  // Per-row Apply / Skip
  list.addEventListener('click', async (e) => {
    const btn = e.target.closest('.autocut-row-btn');
    if (!btn) return;
    const row = btn.closest('.autocut-row');
    const idx = +row.dataset.idx;
    if (btn.dataset.act === 'skip') { row.remove(); return; }
    btn.disabled = true; btn.textContent = '…';
    const r = await applyAutoCuts([cuts[idx]]);
    if (r.ok && r.applied) {
      row.classList.add('applied');
      btn.textContent = 'cut';
    } else {
      btn.disabled = false; btn.textContent = 'Apply';
    }
  });

  // Apply all
  card.querySelector('.autocut-apply-all').addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.textContent = 'Applying…';
    const remaining = [];
    list.querySelectorAll('.autocut-row').forEach(r => {
      if (!r.classList.contains('applied')) remaining.push(cuts[+r.dataset.idx]);
    });
    const r = await applyAutoCuts(remaining);
    if (r.ok && r.applied > 0) {
      e.target.textContent = 'Applied ' + r.applied;
      list.querySelectorAll('.autocut-row:not(.applied)').forEach(rr => rr.classList.add('applied'));
    } else {
      e.target.disabled = false;
      e.target.textContent = 'Apply all';
      // Surface the failure with debug info so we can see what's going on
      const note = document.createElement('div');
      note.style.cssText = 'margin-top:8px;padding:8px 10px;background:rgba(224,116,116,0.08);border:1px solid rgba(224,116,116,0.25);border-radius:6px;font-size:11px;color:var(--text-dim);white-space:pre-wrap';
      const dbg = (r.debug && r.debug.steps) ? r.debug.steps.join('\n') : '';
      note.textContent = (r.error || 'No segments were removed.') + (dbg ? ('\n\n' + dbg) : '');
      card.appendChild(note);
    }
  });

  card.querySelector('.autocut-dismiss').addEventListener('click', () => wrap.wrap.remove());
}

// Auto-Cut button click handler
async function runAutoCut() {
  const btn = document.getElementById('autocutBtn');
  if (!btn || btn.disabled) return;
  const sel = await getSelectedClipInfo();
  if (!sel.ok) {
    makeMsg('claude', '<p style="color:var(--text-dim);font-style:italic">Auto-cut needs a clip selected in the timeline. ' + (sel.error ? escapeHTML(sel.error) : '') + '</p>');
    return;
  }
  if (!sel.path) {
    makeMsg('claude', '<p style="color:var(--text-dim);font-style:italic">Couldn\'t find the source media path for that clip.</p>');
    return;
  }
  clearEmpty();
  makeMsg('you', '<p>Auto-cut <b>' + escapeHTML(sel.name) + '</b></p>');
  btn.classList.add('busy'); btn.disabled = true;
  const placeholder = makeMsg('claude', thinkingHTML());
  const labelEl = placeholder.body.querySelector('.orbit-label');
  if (labelEl) labelEl.textContent = 'Analysing audio';

  try {
    const r = await fetch(BRIDGE + '/autocut', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clipPath: sel.path, clipDuration: sel.duration }),
    });
    const data = await r.json();
    placeholder.wrap.remove();
    if (data.error) {
      makeMsg('claude', '<p>Auto-cut error: ' + escapeHTML(data.error) + '</p>');
      return;
    }
    if (!data.cuts || !data.cuts.length) {
      makeMsg('claude', '<p>No pauses or false starts detected. Nothing to cut.</p>');
      return;
    }
    addAutoCutCard(sel, data.cuts, data.totalCut || 0);
  } catch (err) {
    placeholder.wrap.remove();
    makeMsg('claude', '<p>Auto-cut error: ' + escapeHTML(err.message) + '</p>');
  } finally {
    btn.classList.remove('busy'); btn.disabled = false;
  }
}

async function previewInSource(absPath) {
  const escapedPath = absPath.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
  const raw = await evalES('ccOpenInSource("' + escapedPath + '")');
  try { return JSON.parse(raw); } catch { return { ok:false, error:'parse failed', path:absPath }; }
}

/* Path → readable file:// URL or data URL */
function pathToSrc(absPath, kind) {
  if (kind === 'image' && _fs) {
    try {
      const buf = _fs.readFileSync(absPath);
      const b64 = (typeof Buffer !== 'undefined') ? Buffer.from(buf).toString('base64') : buf.toString('base64');
      return 'data:' + mimeFromExt(extOf(absPath)) + ';base64,' + b64;
    } catch {}
  }
  // For videos, file:// works in CEP for local paths
  return 'file://' + absPath.split(' ').join('%20');
}

/* ───── History (past renders) ───── */
const HISTORY_KEY = 'claudeBridge.history';
const HISTORY_MAX = 30;
const historyBtn = document.getElementById('historyBtn');
const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');
const historyCount = document.getElementById('historyCount');
let history = [];
try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { history = []; }

function saveHistory() {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
  renderHistoryBadge();
}

function addHistoryEntry({prompt, path, mode}) {
  if (!path) return;
  const kind = IMAGE_EXTS.has(extOf(path)) ? 'image' : 'video';
  const entry = { id: Date.now() + '_' + Math.random().toString(36).slice(2,7), prompt: prompt || '', path, kind, mode: mode || '', t: Date.now() };
  history.unshift(entry);
  if (history.length > HISTORY_MAX) history = history.slice(0, HISTORY_MAX);
  saveHistory();
  if (historyPanel.classList.contains('show')) renderHistory();
}

function renderHistoryBadge() {
  if (history.length > 0) {
    historyCount.textContent = history.length;
    historyCount.style.display = '';
  } else {
    historyCount.style.display = 'none';
  }
}

function relTime(ts) {
  const s = Math.max(1, Math.floor((Date.now() - ts) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

const ICON_FILM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/></svg>';

function renderHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<div class="history-empty">No renders yet.<br>Send a message to generate your first animation.</div>';
    return;
  }
  let html = '';
  history.forEach((e, i) => {
    let thumbHTML;
    if (e.kind === 'image') {
      const src = pathToSrc(e.path, 'image');
      thumbHTML = src ? '<img class="history-thumb" data-id="' + e.id + '" src="' + src + '">'
                     : '<div class="history-thumb">' + ICON_FILM + '</div>';
    } else {
      thumbHTML = '<div class="history-thumb" data-id="' + e.id + '">' + ICON_FILM + '</div>';
    }
    const fileExists = !_fs || (function(){ try { return _fs.existsSync(e.path); } catch { return true; } })();
    const promptText = e.prompt ? escapeHTML(e.prompt) : '<span style="opacity:0.5">(no prompt saved)</span>';
    const fname = e.path.split('/').pop();
    const meta = relTime(e.t) + ' · ' + escapeHTML(fname) + (fileExists ? '' : ' · <span style="color:var(--err)">missing</span>');
    html += '<div class="history-item">'
      + thumbHTML
      + '<div class="history-body">'
      +   '<div class="history-prompt">' + promptText + '</div>'
      +   '<div class="history-meta">' + meta + '</div>'
      +   '<div class="history-actions">'
      +     (fileExists ? '<button data-act="preview" data-id="' + e.id + '">Preview</button>' : '')
      +     '<button data-act="reuse" data-id="' + e.id + '">Use prompt</button>'
      +     (fileExists ? '<button data-act="reimport" data-id="' + e.id + '">Re-import</button>' : '')
      +     (fileExists ? '<button data-act="changes" data-id="' + e.id + '">Changes</button>' : '')
      +     '<button class="danger" data-act="delete" data-id="' + e.id + '">Delete</button>'
      +   '</div>'
      + '</div>'
      + '</div>';
  });
  historyList.innerHTML = html;

  historyList.querySelectorAll('.history-thumb').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const e = history.find(x => x.id === id);
      if (!e) return;
      openLightbox({ src: pathToSrc(e.path, e.kind), kind: e.kind, caption: e.path });
    });
  });
  historyList.querySelectorAll('button[data-act]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const idx = history.findIndex(x => x.id === id);
      if (idx === -1) return;
      const e = history[idx];
      if (btn.dataset.act === 'preview') {
        const r = await previewInSource(e.path);
        if (r.ok) {
          closeHistory();
        } else {
          btn.textContent = r.error ? 'Preview failed' : 'Failed';
          btn.style.color = 'var(--err)';
          setTimeout(() => { btn.textContent = 'Preview'; btn.style.color = ''; }, 2500);
        }
      } else if (btn.dataset.act === 'reuse') {
        input.value = e.prompt || '';
        autosize();
        clearGhost();
        closeHistory();
        input.focus();
      } else if (btn.dataset.act === 'reimport') {
        const r = await importIntoPremiere(e.path, activeMode);
        if (r.ok) {
          closeHistory();
          // Show a transient confirmation in the chat area
          clearEmpty();
          const msg = makeMsg('claude', '<p style="color:var(--text-dim);font-style:italic">Re-imported ' + escapeHTML(e.path.split('/').pop()) + '</p>');
          addReceipt(msg.wrap, r);
        }
      } else if (btn.dataset.act === 'changes') {
        // Same flow as the Changes button on a render card — set silent
        // iteration context, focus the composer, close history.
        setIterationContext({ originalPrompt: (e.prompt || '').trim(), originalPath: e.path });
        closeHistory();
        input.focus();
      } else if (btn.dataset.act === 'delete') {
        history.splice(idx, 1);
        saveHistory();
        renderHistory();
      }
    });
  });
}

/* ───── Reference attachment (multi-image, paste-aware) ───── */
const refBar = document.getElementById('refBar');
const REF_EXTS = ['png','jpg','jpeg','webp','gif','mp4','mov','webm','mkv','heic'];
const IMAGE_EXTS = new Set(['png','jpg','jpeg','webp','gif','heic']);
let activeReferences = []; // [{ path, name, kind:'image'|'video', dataUrl? }]
let iterationContext = null; // { originalPrompt, originalPath } — set by the Changes button

function extOf(p) { return (p || '').split('.').pop().toLowerCase(); }
function kindOf(p) { return IMAGE_EXTS.has(extOf(p)) ? 'image' : 'video'; }
function mimeFromExt(e) {
  return e === 'jpg' || e === 'jpeg' ? 'image/jpeg'
       : e === 'png' ? 'image/png'
       : e === 'webp' ? 'image/webp'
       : e === 'gif' ? 'image/gif'
       : e === 'heic' ? 'image/heic'
       : 'application/octet-stream';
}

function readImageAsDataUrl(filePath) {
  if (!_fs) return null;
  try {
    const buf = _fs.readFileSync(filePath);
    const b64 = (typeof Buffer !== 'undefined') ? Buffer.from(buf).toString('base64') : buf.toString('base64');
    return 'data:' + mimeFromExt(extOf(filePath)) + ';base64,' + b64;
  } catch { return null; }
}

function addReference(absPath) {
  if (!absPath) return;
  if (activeReferences.some(r => r.path === absPath)) { renderRefBar(); return; }
  const name = absPath.split('/').pop();
  const kind = kindOf(absPath);
  const ref = { path: absPath, name, kind };
  if (kind === 'image') ref.dataUrl = readImageAsDataUrl(absPath);
  activeReferences.push(ref);
  renderRefBar();
}
function removeReferenceAt(idx) {
  activeReferences.splice(idx, 1);
  renderRefBar();
}
function clearReferences() {
  activeReferences = [];
  renderRefBar();
}

function pickReferenceFile() {
  // CEP file API — fileTypes MUST be a comma-separated string, not array.
  try {
    if (window.cep && window.cep.fs && window.cep.fs.showOpenDialog) {
      const r = window.cep.fs.showOpenDialog(true, false, 'Choose reference images or videos', '~', REF_EXTS.join(','));
      if (r && r.err === 0 && r.data && r.data.length) {
        for (const p of r.data) addReference(p);
        return;
      }
    }
  } catch {}
  // Browser/dev fallback
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.multiple = true;
  inp.accept = REF_EXTS.map(e => '.' + e).join(',');
  inp.style.display = 'none';
  inp.addEventListener('change', () => {
    if (inp.files) {
      for (const f of inp.files) if (f && (f.path || f.name)) addReference(f.path || f.name);
    }
    inp.remove();
  });
  document.body.appendChild(inp);
  inp.click();
}

// Save a clipboard or dropped File/Blob to disk and attach
async function attachBlobAsReference(blob, suggestedExt) {
  if (!_fs || !OUTPUT_DIR_JS) return null;
  try { _fs.mkdirSync(OUTPUT_DIR_JS, { recursive: true }); } catch {}
  const ext = suggestedExt
    || (blob.type ? blob.type.split('/')[1].split(';')[0] : 'png')
    || 'png';
  const filename = '_pasted_' + Date.now() + '.' + ext;
  const filePath = (_path ? _path.join(OUTPUT_DIR_JS, filename) : OUTPUT_DIR_JS + '/' + filename);
  try {
    const buf = await blob.arrayBuffer();
    const data = (typeof Buffer !== 'undefined') ? Buffer.from(buf) : new Uint8Array(buf);
    _fs.writeFileSync(filePath, data);
    addReference(filePath);
    return filePath;
  } catch (err) {
    console.error('attach blob failed:', err);
    return null;
  }
}

/* Plain paste (Cmd+V or right-click → Paste) is now ALWAYS treated as text.
   Use Shift+B to explicitly attach an image from clipboard as a reference.
   The previous handler was preventing default whenever an image was on the
   clipboard, which broke text paste when both formats were present. */

// Read an image off the system clipboard. Tries the modern Clipboard API
// first, then falls back to a platform-specific shell command:
//   macOS   → osascript reads PNG data
//   Windows → PowerShell pulls Clipboard.GetImage() and saves PNG
async function readClipboardImage() {
  if (navigator.clipboard && navigator.clipboard.read) {
    try {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        for (const type of item.types) {
          if (type.startsWith('image/')) {
            const blob = await item.getType(type);
            return { blob, ext: (type.split('/')[1] || 'png') };
          }
        }
      }
    } catch {}
  }
  if (!_fs || !OUTPUT_DIR_JS) return null;
  const cp = nodeRequire('child_process');
  if (!cp) return null;
  const tmpPath = _path.join(OUTPUT_DIR_JS, '_clip_' + Date.now() + '.png');

  if (isMac) {
    try {
      const script = 'try\n'
        + '  set theImageData to (the clipboard as «class PNGf»)\n'
        + '  set theFile to open for access POSIX file "' + tmpPath + '" with write permission\n'
        + '  write theImageData to theFile\n'
        + '  close access theFile\n'
        + '  return "ok"\n'
        + 'on error\n  return "no"\nend try';
      const out = cp.execFileSync('osascript', ['-e', script], { encoding: 'utf8' });
      if (out && out.trim() === 'ok' && _fs.existsSync(tmpPath)) {
        const buf = _fs.readFileSync(tmpPath);
        try { _fs.unlinkSync(tmpPath); } catch {}
        return { blob: new Blob([buf], { type: 'image/png' }), ext: 'png' };
      }
    } catch {}
  } else if (isWindows) {
    try {
      const psPath = tmpPath.replace(/'/g, "''");
      const ps = "Add-Type -AssemblyName System.Windows.Forms,System.Drawing;"
        + "$img = [System.Windows.Forms.Clipboard]::GetImage();"
        + "if ($img) { $img.Save('" + psPath + "', [System.Drawing.Imaging.ImageFormat]::Png); $img.Dispose(); 'ok' } else { 'no' }";
      const out = cp.execFileSync('powershell', ['-NoProfile', '-NonInteractive', '-Command', ps], { encoding: 'utf8', timeout: 8000 });
      if (out && out.trim() === 'ok' && _fs.existsSync(tmpPath)) {
        const buf = _fs.readFileSync(tmpPath);
        try { _fs.unlinkSync(tmpPath); } catch {}
        return { blob: new Blob([buf], { type: 'image/png' }), ext: 'png' };
      }
    } catch {}
  }
  return null;
}

// Shift+V → paste text from clipboard at the cursor in the input.
// Shift+B → paste image from clipboard as a reference attachment.
// Shift+C → copy current input value (or selection) to clipboard.
// All three intercept their key (V/B/C won't type with Shift held). Use Caps
// Lock for capital V/B/C, or paste them in via Shift+V.

async function readClipboardText() {
  if (navigator.clipboard && navigator.clipboard.readText) {
    try {
      const t = await navigator.clipboard.readText();
      if (typeof t === 'string') return t;
    } catch {}
  }
  const cp = nodeRequire('child_process');
  if (!cp) return null;
  if (isMac) {
    try { return cp.execFileSync('pbpaste', [], { encoding: 'utf8' }); } catch {}
  } else if (isWindows) {
    try {
      const out = cp.execFileSync('powershell', ['-NoProfile', '-NonInteractive', '-Command', 'Get-Clipboard -Raw'], { encoding: 'utf8', timeout: 4000 });
      return out.replace(/\r\n$/, '');
    } catch {}
  }
  return null;
}

function writeClipboardTextSync(text) {
  if (!text) return false;
  // execCommand('copy') is the most reliable path inside CEP's older Chromium
  // and respects the user-gesture from the keydown event we're inside.
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    const prevActive = document.activeElement;
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;

async function writeClipboardText(text) {

  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
  }
  // 3) Shell fallbacks for macOS / Windows
  const cp = nodeRequire('child_process');
  if (!cp) return false;
  if (isMac) {
    try {
      const p = cp.spawn('/usr/bin/pbcopy');
      p.stdin.write(text); p.stdin.end();
      return true;
    } catch {}
  } else if (isWindows) {
    try {
      const p = cp.spawn('powershell', ['-NoProfile', '-NonInteractive', '-Command', '$input | Set-Clipboard']);
      p.stdin.write(text); p.stdin.end();
      return true;
    } catch {}
  }
  return false;
}

function insertTextAtCursor(text) {
  if (!text) return;
  if (document.activeElement !== input) input.focus();
  const start = (typeof input.selectionStart === 'number') ? input.selectionStart : input.value.length;
  const end   = (typeof input.selectionEnd   === 'number') ? input.selectionEnd   : input.value.length;
  const before = input.value.slice(0, start);
  const after  = input.value.slice(end);
  input.value = before + text + after;
  const pos = start + text.length;
  input.setSelectionRange(pos, pos);
  autosize();
  syncExpandEnabled && syncExpandEnabled();
  // Trigger any listeners hooked to "input" so ghost autocomplete refreshes
  input.dispatchEvent(new Event('input', { bubbles: true }));

document.addEventListener('keydown', async (e) => {
  if (!e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
  if (lightbox.classList.contains('show')) return;
  const k = e.key;

  if (k === 'V' || k === 'v') {
    e.preventDefault();
    const text = await readClipboardText();
    if (text) insertTextAtCursor(text);

  }
  if (k === 'B' || k === 'b') {

    if (img) {

    const sel = window.getSelection && window.getSelection();
    if (sel && sel.toString && sel.toString().length > 0) {

/* ───── Markdown-lite ───── */
function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function renderMarkdown(text) {
  let s = escapeHTML(text);
  s = s.replace(/\[\[IMPORT:[^\]]+\]\]/g, '').trim();
  s = s.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) =>
    '<pre><code>' + code.replace(/\n$/, '') + '</code></pre>');
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>');
  const lines = s.split('\n');
  let out = [], inList = false;
  for (const ln of lines) {
    const m = ln.match(/^[-*]\s+(.*)$/);
    if (m) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + m[1] + '</li>'); }
    else   { if (inList) { out.push('</ul>'); inList = false; } out.push(ln); }
  }
  if (inList) out.push('</ul>');
  s = out.join('\n');
  s = s.split(/\n{2,}/).map(p => {
    if (/^<(ul|pre|h\d|blockquote)/.test(p.trim())) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  return s || '<p></p>';
}

/* ───── Word-by-word reveal ───── */
function streamReveal(rootElement) {
  const SKIP = new Set(['CODE', 'PRE']);
  const walker = document.createTreeWalker(rootElement, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      let p = node.parentNode;
      while (p && p !== rootElement) {
        if (SKIP.has(p.nodeName)) return NodeFilter.FILTER_REJECT;
        p = p.parentNode;
      }
      return node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const textNodes = [];
  let n;
  while (n = walker.nextNode()) textNodes.push(n);

  let wordIdx = 0;
  const STAGGER = 18;
  const MAX_STAGGER_MS = 1500; // cap so very long replies don't queue 5s of animations
  for (const tn of textNodes) {
    const parts = tn.nodeValue.split(/(\s+)/);
    const frag = document.createDocumentFragment();
    for (const part of parts) {
      if (!part) continue;
      if (/^\s+$/.test(part)) {
        frag.appendChild(document.createTextNode(part));
      } else {
        const span = document.createElement('span');
        span.className = 'word';
        span.style.animationDelay = Math.min(wordIdx * STAGGER, MAX_STAGGER_MS) + 'ms';
        span.textContent = part;
        frag.appendChild(span);
        wordIdx++;
      }
    }
    tn.parentNode.replaceChild(frag, tn);
  }
}

// Typical duration per status — used to predict the rest of the run when the
// current step is known. Numbers are rough; they're aimed at being honest
// rather than exact, and they shift as the bridge sends new status events.
const STEP_DURATIONS = {
  'Thinking':                 8,
  'Reading reference image':  4,
  'Extracting reference frame': 5,
  'Running ffmpeg':           4,
  'Reading':                  2,    // matches "Reading <file>"
  'Writing':                  4,    // matches "Writing <file>"
  'Editing':                  3,    // matches "Editing <file>"
  'Searching project':        2,
  'Searching code':           2,
  'Fetching reference':       6,
  'Running command':          5,
  'Installing dependencies':  90,
  'Rendering video':          45,
  'Tool':                     3,    // generic fallback
};
// Steps we still expect to come after the current one. If we're at "Rendering
// video", we're done after; if we're at "Reading reference image", we still
// have to write code + register + render.
function remainingAfter(status) {
  const order = ['Thinking', 'Reading reference image', 'Extracting reference frame',
                 'Reading', 'Writing', 'Editing', 'Rendering video'];
  let idx = order.findIndex(s => status === s || status.startsWith(s + ' '));
  if (idx === -1) return 30; // unknown — assume some work left
  // Sum durations of typical remaining steps from idx+1 onward
  let total = 0;
  for (let i = idx + 1; i < order.length; i++) {
    total += STEP_DURATIONS[order[i]] || 4;
  }
  return total;
}
function durationFor(status) {
  if (!status) return 8;
  // Try exact key, then prefix-based key (e.g. "Reading Root.tsx" → "Reading")
  if (STEP_DURATIONS[status] != null) return STEP_DURATIONS[status];
  for (const k of Object.keys(STEP_DURATIONS)) {
    if (status.startsWith(k + ' ') || status.startsWith(k + ':')) return STEP_DURATIONS[k];
  }
  return STEP_DURATIONS['Tool'] || 4;
}

function formatDuration(sec) {
  if (sec < 60) return Math.round(sec) + 's';
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return s ? m + 'm ' + s + 's' : m + 'm';
}

/* Estimate how long a prompt will take based on what it's asking for.
   Heuristic, not measured — Remotion is pre-scaffolded so npm install no
   longer dominates. Cold-start of the claude CLI is ~7s baseline.
   Used as the time-constant in the asymptotic progress curve below. */
function estimatePromptDuration(message, hasReference) {
  const lower = (message || '').toLowerCase();
  let est = 12; // baseline chat reply (claude cold-start + reasoning)

  const isRender = /render|animation|animate|intro|outro|transition|lower\s*third|callout|countdown|logo|kinetic|caption|particles?|grain|reveal|graphic|video clip|motion|card|toast|banner|popup/.test(lower);
  const isComplex = /multi.?scene|with\s+sound|cinematic|particle|3d|three.?dee|sequence|montage|complex|advanced|elaborate/.test(lower);
  const isIteration = /^make a new version|previous file|previous render/i.test(message || '');

  if (isIteration) {
    // Editing an existing component — Claude usually keeps changes minimal
    est = 35;
  } else if (isRender) {
    est = isComplex ? 110 : 55;
  }
  // Reference image/video reads add a Read or ffmpeg call
  if (hasReference) est += 20;
  // Heavy phrasing implies more work
  if (/multiple|several|3 variations|variations|alternate/.test(lower)) est *= 1.4;
  return Math.round(est);
}

/* Asymptotic progress UI:
   ratio = 1 - exp(-t/T) — fast initial fill, slow approach to (capped) 92%.
   Stays under 100% until external code calls complete(). */
function makeProgressUI(thinkingBody, estimateSeconds) {
  const fill = thinkingBody.querySelector('.progress-bar-fill');
  const bar = thinkingBody.querySelector('.progress-bar');
  const elapsedEl = thinkingBody.querySelector('.thinking-elapsed');
  const etaEl = thinkingBody.querySelector('.thinking-eta');
  const start = Date.now();
  let completed = false;
  const CAP = 92;

  // Step-aware ETA — resets the "deadline" each time the status changes to
  // (now + duration_for_current_step + duration_of_steps_likely_to_follow).
  let stepStart = Date.now();
  let stepDuration = STEP_DURATIONS['Thinking'];
  let stepRemainingAfter = remainingAfter('Thinking');
  let currentStatus = 'Thinking';

  function setStatus(text) {
    if (!text || text === currentStatus) return;
    currentStatus = text;
    stepStart = Date.now();
    stepDuration = durationFor(text);
    stepRemainingAfter = remainingAfter(text);
  }

  function tick() {
    if (completed) return;
    const sec = (Date.now() - start) / 1000;
    const s = Math.floor(sec);
    if (s >= 1) elapsedEl.textContent = (s < 60) ? s + 's' : (Math.floor(s / 60) + 'm ' + (s % 60) + 's');

    // ETA = (time left in this step) + (duration of remaining steps)
    const stepElapsed = (Date.now() - stepStart) / 1000;
    const stepLeft = Math.max(0, stepDuration - stepElapsed);
    const totalLeft = stepLeft + stepRemainingAfter;
    if (etaEl) {
      if (totalLeft > 1) {
        etaEl.textContent = '~' + formatDuration(totalLeft) + ' left';
      } else {
        etaEl.textContent = 'finishing up';
      }
    }

    // Progress bar — use total elapsed vs. total estimated
    const totalEstimate = stepDuration + stepRemainingAfter + (stepStart - start) / 1000 || 30;
    const pct = (1 - Math.exp(-sec / Math.max(8, totalEstimate))) * CAP;
    fill.style.width = Math.min(pct, CAP).toFixed(1) + '%';
  }
  const timer = setInterval(tick, 200);
  tick();

  return {
    complete() {
      if (completed) return;
      completed = true;
      bar.classList.add('complete');
      fill.style.width = '100%';
    },
    cleanup() { clearInterval(timer); },
    setStatus,
  };
}

/* Auto-open the rendered file in the user's browser (Chrome preferred, falls
